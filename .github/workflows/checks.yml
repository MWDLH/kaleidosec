name: checks

on:
  push:
  pull_request:

jobs:
  protocol-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tiktoken (exact token counts)
        run: pip install tiktoken
      - name: Budget check
        run: python scripts/check_budget.py
      - name: Plugin entry sync check
        run: python scripts/check_sync.py
